name: DNS check

# Temporary: looks up nysportsbar.com's DNS records and reports them as run annotations.
on:
  push:
    branches: [claude/nyc-sports-news-site-7jjbt4]
    paths: ['.github/workflows/dnscheck.yml']

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ns in 8.8.8.8 1.1.1.1; do
            echo "::notice title=TXT via $ns::$(dig +short TXT nysportsbar.com @$ns | tr '\n' ' ')"
          done
          AUTH=$(dig +short NS nysportsbar.com @8.8.8.8 | head -1)
          echo "::notice title=Nameservers::$(dig +short NS nysportsbar.com @8.8.8.8 | tr '\n' ' ')"
          echo "::notice title=TXT at authoritative $AUTH::$(dig +short TXT nysportsbar.com @$AUTH | tr '\n' ' ')"
          echo "::notice title=TXT on www::$(dig +short TXT www.nysportsbar.com @$AUTH | tr '\n' ' ')"
          echo "::notice title=TXT on nysportsbar.com.nysportsbar.com::$(dig +short TXT nysportsbar.com.nysportsbar.com @$AUTH | tr '\n' ' ')"
          echo "::notice title=A records::$(dig +short A nysportsbar.com @$AUTH | tr '\n' ' ')"
