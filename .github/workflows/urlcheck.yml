name: URL check

# Temporary: fetches the sitemap and robots.txt the way a crawler would and reports as annotations.
on:
  push:
    branches: [claude/nyc-sports-news-site-7jjbt4]
    paths: ['.github/workflows/urlcheck.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in https://nysportsbar.com/sitemap.xml http://nysportsbar.com/sitemap.xml https://www.nysportsbar.com/sitemap.xml https://nysportsbar.com/robots.txt https://nysportsbar.com/new-york-giants/; do
            R=$(curl -sS -A "$UA" -o /tmp/body -w "status=%{http_code} type=%{content_type} final=%{url_effective} redirects=%{num_redirects} ssl_verify=%{ssl_verify_result}" -L "$u" 2>&1)
            echo "::notice title=$u::$R bytes=$(wc -c < /tmp/body 2>/dev/null) head=$(head -c 160 /tmp/body 2>/dev/null | tr '\n' ' ')"
          done
          echo "::notice title=TLS cert::$(echo | openssl s_client -servername nysportsbar.com -connect nysportsbar.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | tr '\n' ' ')"
          echo "::notice title=Sitemap URL count::$(curl -sS https://nysportsbar.com/sitemap.xml | grep -c '<loc>')"
