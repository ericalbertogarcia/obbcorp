name: Probe data sources

# Temporary: samples ESPN futures and Sleeper fantasy APIs and commits the samples to this branch.
on:
  push:
    branches: [claude/nyc-sports-news-site-7jjbt4]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sample
        run: |
          mkdir -p diagnostics
          node --input-type=module -e "
          import { writeFileSync } from 'node:fs';
          const get = async (u) => { try { const r = await fetch(u, { headers: { 'user-agent': 'Mozilla/5.0' } }); return { status: r.status, body: r.ok ? await r.json() : (await r.text()).slice(0, 300) }; } catch (e) { return { error: e.message }; } };
          const trim = (o, depth = 0) => {
            if (Array.isArray(o)) return [...o.slice(0, depth > 2 ? 2 : 4).map((x) => trim(x, depth + 1)), ...(o.length > 4 ? ['…' + o.length + ' items'] : [])];
            if (o && typeof o === 'object') return Object.fromEntries(Object.entries(o).slice(0, 40).map(([k, v]) => [k, trim(v, depth + 1)]));
            return typeof o === 'string' && o.length > 200 ? o.slice(0, 200) : o;
          };
          const out = {};
          const core = 'https://sports.core.api.espn.com/v2/sports';
          for (const [sport, league, season] of [['football','nfl',2026],['baseball','mlb',2027],['baseball','mlb',2026],['basketball','nba',2027],['hockey','nhl',2027],['basketball','wnba',2027],['basketball','wnba',2026]]) {
            const r = await get(core + '/' + sport + '/leagues/' + league + '/seasons/' + season + '/futures?limit=100');
            out['futures_' + league + '_' + season] = { status: r.status, error: r.error, count: r.body?.count, names: r.body?.items?.map((i) => i.name + ' | ' + (i.displayName || '') + ' | type=' + (i.type || '') + ' | rows=' + (i.futures?.[0]?.books?.length ?? '?') + ' | providers=' + (i.futures || []).map((f) => f.provider?.name).join('/')), first: trim(r.body?.items?.[0]) };
          }
          const state = await get('https://api.sleeper.app/v1/state/nfl');
          out.sleeper_state = state;
          const wk = state.body?.week || state.body?.display_week || 8;
          const season = state.body?.season || 2026;
          const pos = ['QB','RB','WR','TE','K','DEF'].map((p) => 'position[]=' + p).join('&');
          const proj = await get('https://api.sleeper.app/projections/nfl/' + season + '/' + wk + '?season_type=regular&' + pos);
          out.sleeper_proj = { status: proj.status, error: proj.error, count: proj.body?.length, nySample: (proj.body || []).filter((p) => ['NYG','NYJ','BUF'].includes(p.team || p.player?.team)).slice(0, 3), keys: Object.keys(proj.body?.[0] || {}), statKeys: Object.keys(proj.body?.[0]?.stats || {}).slice(0, 60) };
          const stats = await get('https://api.sleeper.app/stats/nfl/' + season + '/' + (wk - 1) + '?season_type=regular&' + pos);
          out.sleeper_stats = { status: stats.status, error: stats.error, count: stats.body?.length, nySample: (stats.body || []).filter((p) => ['NYG','NYJ','BUF'].includes(p.team || p.player?.team)).slice(0, 2) };
          for (const kind of ['add', 'drop']) {
            const t = await get('https://api.sleeper.app/v1/players/nfl/trending/' + kind + '?lookback_hours=24&limit=10');
            out['sleeper_trending_' + kind] = t;
          }
          writeFileSync('diagnostics/probe.json', JSON.stringify(out, null, 1));
          "
      - name: Commit samples
        run: |
          git config user.name "ny-sports-bar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/probe.json
          git commit -m "Data source samples"
          git push origin "HEAD:$GITHUB_REF_NAME"
