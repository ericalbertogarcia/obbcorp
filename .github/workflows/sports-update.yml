name: Update NY Sports Bar

# Refreshes sports/data/feed.json, prerenders a page per team view into dist/, and publishes dist/ on GitHub Pages
# (served at nysportsbar.com, set under Settings → Pages → Custom domain).
# The feed is deployed rather than committed, so the 5-minute schedule doesn't flood git history.
# Requires: Settings → Pages → Source = "GitHub Actions".
# Optional secret: X_BEARER_TOKEN (beat-reporter posts from X).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      # The previous feed carries roster snapshots (for move detection), X since_ids and older stories.
      - name: Restore last published feed
        run: |
          if curl -fsSL "${{ steps.pages.outputs.base_url }}/data/feed.json" -o "$RUNNER_TEMP/feed.json" \
             && node -e "JSON.parse(require('fs').readFileSync(process.argv[1]))" "$RUNNER_TEMP/feed.json"; then
            cp "$RUNNER_TEMP/feed.json" sports/data/feed.json
          else
            echo "No published feed yet; starting fresh"
          fi
      - name: Fetch news, reporter posts, schedules, rosters and moves
        run: node scripts/update-sports.mjs
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Build search-friendly pages, sitemap and robots.txt
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
