name: Update NY Sports Wire

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-sports.mjs'
      - 'sports/js/espn.mjs'
      - 'sports/data/teams.json'

permissions:
  contents: write

concurrency:
  group: sports-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch news, schedules, rosters and moves
        run: node scripts/update-sports.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- sports/data/feed.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "ny-sports-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/data/feed.json
          git commit -m "Update NY sports feed"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
