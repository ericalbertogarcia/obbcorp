<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NY Sports Bar — The #1 Site for New York Sports</title>
<meta name="description" content="NY Sports Bar — the #1 site for New York sports. Live news, scores, injuries, beat reporters and roster moves for the Giants, Jets, Yankees, Mets, Devils, Rangers and Islanders.">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">NY</span>
      <span class="brand-text"><span class="brand-name">Sports <b>Bar</b></span><span class="brand-tag">The #1 site for New York sports</span></span>
    </a>
    <div class="masthead-meta">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="updated">Loading…</span>
      <button id="alerts" class="icon-btn" title="Get alerts for injuries and roster moves" aria-label="Toggle breaking alerts">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button id="refresh" class="icon-btn" title="Refresh now" aria-label="Refresh now">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
  <div class="ticker" id="ticker" aria-label="Scores and schedule"></div>
  <nav class="team-nav" id="team-nav" aria-label="Teams"></nav>
</header>

<main id="app" class="page"></main>

<footer class="site-footer">
  <p>Headlines link to their original publishers. Data from ESPN, MLB.com, Google News, team beat outlets and beat reporters on X and Bluesky, refreshed automatically.</p>
</footer>

<template id="tpl-empty">
  <div class="empty">Nothing here yet — check back after the next update.</div>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
